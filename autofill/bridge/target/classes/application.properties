# ---------------------------------------------------------------------------
# Autofill bridge configuration
# ---------------------------------------------------------------------------

# Port the Chrome extension talks to. Keep this in sync with the Bridge URL in
# the extension's options page (default http://localhost:3111).
server.port=3111

# Which network interface to listen on. THIS LINE IS A SECURITY CONTROL, not a
# tidiness setting - do not delete it.
#
# Without it, Spring passes null to the embedded Tomcat connector and Tomcat
# binds 0.0.0.0, i.e. EVERY interface. /fill has no authentication and it runs
# your logged-in Claude Code CLI with whatever prompt the caller sends, so on a
# cafe or office Wi-Fi any other machine on the network could do this:
#
#     curl -X POST http://<your-laptop-ip>:3111/fill \
#          -H 'Content-Type: application/json' -d '{"prompt":"..."}'
#
# ...and get a 200 back, burning your subscription and running the CLI against
# your filesystem. Binding to the loopback address means only programs running
# on THIS machine can connect, which is exactly what the extension needs.
#
# IPv6 note: this binds the IPv4 loopback (127.0.0.1) only. The extension dials
# http://localhost:3111, and browsers resolving "localhost" try both ::1 and
# 127.0.0.1, so it still connects. If your machine ever refuses the connection
# because it only offers IPv6, change this to ::1 - never to 0.0.0.0.
server.address=127.0.0.1

# Absolute path to the Claude Code CLI executable.
#
# IMPORTANT: run  `which claude`  in your terminal and paste the result here.
# ProcessBuilder starts the binary DIRECTLY - it does not go through a shell,
# so it never reads your ~/.zshrc and therefore never sees any PATH entries you
# added there (nvm, homebrew, ~/.local/bin, npm global bin, ...). A bare
# "claude" would fail with "Cannot run program \"claude\": No such file or
# directory" even though it works fine when you type it yourself.
claude.binary-path=/usr/local/bin/claude

# Hard wall clock limit for one CLI invocation. When it is exceeded the child
# process is force killed and the bridge answers 504 Gateway Timeout.
claude.timeout-seconds=120

# Our own logging. Set to DEBUG to see the full prompt and stdout of every call.
logging.level.com.longfloat.autofill=INFO
